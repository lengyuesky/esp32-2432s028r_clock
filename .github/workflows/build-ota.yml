name: Build OTA firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ota-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ota:
    name: Build ESP32 OTA image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          path: .

      - name: Prepare OTA artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/cyd_clock.bin
          mkdir -p ota
          cp build/cyd_clock.bin ota/cyd_clock.bin
          sha256sum ota/cyd_clock.bin > ota/cyd_clock.bin.sha256
          cp build/partition_table/partition-table.bin ota/partition-table.bin
          cp build/ota_data_initial.bin ota/ota_data_initial.bin

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyd-clock-ota-${{ github.sha }}
          if-no-files-found: error
          path: |
            ota/cyd_clock.bin
            ota/cyd_clock.bin.sha256
            ota/partition-table.bin
            ota/ota_data_initial.bin

      - name: Publish OTA images to releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_RELEASE_TAG: ota-latest
          MAX_MANAGED_RELEASES: 3
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          release_stamp="$(date -u '+%Y%m%d-%H%M%S')"
          built_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          archive_tag="ota-${release_stamp}-${short_sha}"
          archive_keep=$((MAX_MANAGED_RELEASES - 1))
          if (( archive_keep < 0 )); then
            archive_keep=0
          fi

          cat > ota/release-notes.md <<EOF
          Automated OTA build from main.

          Commit: ${GITHUB_SHA}
          Built: ${built_at}

          Latest release OTA URL:
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cyd_clock.bin

          This release OTA URL:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${archive_tag}/cyd_clock.bin

          Compatibility OTA URL:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROLLING_RELEASE_TAG}/cyd_clock.bin
          EOF

          gh release create "${archive_tag}" \
            ota/cyd_clock.bin \
            ota/cyd_clock.bin.sha256 \
            ota/partition-table.bin \
            ota/ota_data_initial.bin \
            --target "${GITHUB_SHA}" \
            --title "CYD Clock OTA ${release_stamp} (${short_sha})" \
            --notes-file ota/release-notes.md \
            --latest

          cat > ota/rolling-release-notes.md <<EOF
          Rolling OTA compatibility release.

          Commit: ${GITHUB_SHA}
          Built: ${built_at}

          OTA URL:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROLLING_RELEASE_TAG}/cyd_clock.bin
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${ROLLING_RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${ROLLING_RELEASE_TAG}" --force

          if gh release view "${ROLLING_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${ROLLING_RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "CYD Clock OTA latest (${short_sha})" \
              --notes-file ota/rolling-release-notes.md
          else
            gh release create "${ROLLING_RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "CYD Clock OTA latest (${short_sha})" \
              --notes-file ota/rolling-release-notes.md
          fi

          gh release upload "${ROLLING_RELEASE_TAG}" \
            ota/cyd_clock.bin \
            ota/cyd_clock.bin.sha256 \
            ota/partition-table.bin \
            ota/ota_data_initial.bin \
            --clobber

          gh release edit "${archive_tag}" --latest

          mapfile -t stale_tags < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq "[.[] | select(.tag_name | startswith(\"ota-\")) | select(.tag_name != \"${ROLLING_RELEASE_TAG}\")] | sort_by(.created_at) | reverse | .[${archive_keep}:][] | .tag_name"
          )
          for stale_tag in "${stale_tags[@]}"; do
            gh release delete "${stale_tag}" --yes --cleanup-tag
          done

      - name: Upload OTA image to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            ota/cyd_clock.bin \
            ota/cyd_clock.bin.sha256 \
            --clobber
